<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>QSA · QUETTA 교무 시스템</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230D3E43'/><text x='16' y='22' font-size='15' font-weight='800' text-anchor='middle' fill='%2300B2BE' font-family='sans-serif'>Q</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="core/ui.css?v=20261118065957">
  <!-- 배포 버전: 파일을 바꿀 때마다 v 값을 올려서 브라우저·GitHub 캐시가 예전 파일을 쓰지 않게 함 -->
  <script type="importmap" id="qsa-version">
{
  "imports": {
    "./core/auth.js": "./core/auth.js?v=20261118065957",
    "./core/config.js": "./core/config.js?v=20261118065957",
    "./core/firebase.js": "./core/firebase.js?v=20261118065957",
    "./core/router.js": "./core/router.js?v=20261118065957",
    "./modules/accounts.js": "./modules/accounts.js?v=20261118065957",
    "./modules/cert-import.js": "./modules/cert-import.js?v=20261118065957",
    "./modules/cert.js": "./modules/cert.js?v=20261118065957",
    "./modules/cert/legacy.js": "./modules/cert/legacy.js?v=20261118065957",
    "./modules/class-assign.js": "./modules/class-assign.js?v=20261118065957",
    "./modules/class-assign/engine.js": "./modules/class-assign/engine.js?v=20261118065957",
    "./modules/class-assign/tables.js": "./modules/class-assign/tables.js?v=20261118065957",
    "./modules/enroll-import.js": "./modules/enroll-import.js?v=20261118065957",
    "./modules/enroll.js": "./modules/enroll.js?v=20261118065957",
    "./modules/enroll/legacy.js": "./modules/enroll/legacy.js?v=20261118065957",
    "./modules/forest-week.js": "./modules/forest-week.js?v=20261118065957",
    "./modules/home.js": "./modules/home.js?v=20261118065957",
    "./modules/schol-import.js": "./modules/schol-import.js?v=20261118065957",
    "./modules/scholarship.js": "./modules/scholarship.js?v=20261118065957",
    "./modules/seat-import.js": "./modules/seat-import.js?v=20261118065957",
    "./modules/seat.js": "./modules/seat.js?v=20261118065957",
    "./modules/settings.js": "./modules/settings.js?v=20261118065957",
    "./modules/sms.js": "./modules/sms.js?v=20261118065957"
  }
}
</script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
</head>
<body>

  <!-- 시작 안내: 정상 시작되면 숨겨지고, 막히면 원인을 보여줍니다 -->
  <div class="boot" id="boot" role="status">
    <div class="boot-card">
      <b class="boot-mark">QSA</b>
      <p class="boot-title">불러오는 중…</p>
      <p class="boot-detail"></p>
    </div>
  </div>
  <script>
    window.qsaBootFail = function (title, detail) {
      var b = document.getElementById("boot");
      b.classList.add("boot-error");
      b.setAttribute("role", "alert");
      b.querySelector(".boot-title").textContent = title;
      b.querySelector(".boot-detail").textContent = detail || "";
      b.hidden = false;
    };
    if (location.protocol === "file:") {
      qsaBootFail(
        "파일을 직접 열면 동작하지 않습니다",
        "QSA는 여러 파일로 나뉜 구조라, 브라우저가 파일 주소(file://)에서는 불러오기를 막습니다. GitHub Pages 주소로 열거나, 이 폴더에서 로컬 서버를 실행한 뒤 http://localhost 주소로 열어주세요. 방법은 README의 '내 PC에서 확인하기'에 있습니다."
      );
    } else {
      setTimeout(function () {
        if (!window.qsaBooted) qsaBootFail(
          "QSA를 시작하지 못했습니다",
          "인터넷 연결을 확인하고 새로고침하세요. 계속되면 F12 > Console 탭의 빨간 오류 내용을 담당자에게 전달해 주세요."
        );
      }, 10000);
    }
  </script>

  <!-- 로그인 -->
  <main class="login" id="login" hidden>
    <div class="login-card">
      <h1 class="wordmark">QSA</h1>
      <p class="login-sub">QUETTA 교무 시스템입니다.<br>등록된 Google 계정으로 로그인하세요.</p>
      <button class="btn btn-lg btn-brand" id="btnLogin" type="button"><i data-lucide="log-in"></i>Google 계정으로 로그인</button>
      <div class="notice" id="loginMsg" role="alert" hidden></div>
      <p class="login-foot">허용목록에 등록된 계정만 사용할 수 있습니다.</p>
    </div>
  </main>

  <!-- 셸 (DSA 와 같은 틀) -->
  <div class="shell" id="shell" hidden>
    <aside class="side" aria-label="QSA 메뉴">
      <a class="side-logo" href="#home"><b>QSA</b><small>QUETTA<br>ADMIN</small></a>
      <div class="side-profile">
        <div class="avatar" id="avatar"></div>
        <div class="yr" id="year"></div>
        <div class="org"><span>강남대성기숙 QUETTA</span>
          <button type="button" id="btnLogoutSide" title="로그아웃" aria-label="로그아웃"><i data-lucide="log-out"></i></button>
        </div>
        <div class="clock" id="clock"></div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="qsa-toast" id="toast" role="status" hidden></div>

    <div class="frame">
      <header class="topbar">
        <button class="icon-btn" id="btnMenu" type="button" aria-label="메뉴 접기/펼치기"><i data-lucide="menu"></i></button>
        <span class="spacer"></span>
        <div class="user-menu">
          <button type="button" id="btnUser" aria-haspopup="true" aria-expanded="false"><span id="userName"></span><i data-lucide="chevron-down"></i></button>
          <div class="dropdown" id="userDrop" hidden>
            <div class="who" id="userEmail"></div>
            <button type="button" id="btnLogout"><i data-lucide="log-out"></i>로그아웃</button>
          </div>
        </div>
      </header>

      <div class="crumbs" id="crumbs"></div>

      <div class="page">
        <div class="page-head">
          <h1 id="pageTitle"></h1>
          <button class="btn btn-line btn-sm" id="btnBack" type="button"><i data-lucide="chevron-left"></i>뒤로가기</button>
        </div>
        <main id="view"></main>
      </div>
    </div>
  </div>

  <script type="module">
    import { firebaseConfig, menu, flatMenu, canSee } from "./core/config.js";

    // 설정값이 비어 있으면 Firebase 를 건드리기 전에 안내하고 멈춤
    const unset = Object.values(firebaseConfig).some((v) => String(v).startsWith("PASTE_"));
    if (unset) {
      window.qsaBootFail(
        "Firebase 설정값이 아직 없습니다",
        "core/config.js 의 firebaseConfig 에 Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)의 값을 붙여넣어 주세요. 순서는 README의 '처음 설정' 1~6번에 있습니다."
      );
      throw new Error("QSA: firebaseConfig 미설정");
    }

    let auth, db, signInWithGoogle, logout, watchAuth, render, stopRouter;
    try {
      ({ auth, db } = await import("./core/firebase.js"));
      ({ signInWithGoogle, logout, watchAuth } = await import("./core/auth.js"));
      ({ render, stopRouter } = await import("./core/router.js"));
    } catch (e) {
      window.qsaBootFail(
        "Firebase 에 연결하지 못했습니다",
        `core/config.js 의 설정값이 맞는지 확인해 주세요. (${e.code || e.message})`
      );
      throw e;
    }
    window.qsaBooted = true;

    const $ = (id) => document.getElementById(id);
    const icons = () => window.lucide?.createIcons();
    const isMobile = () => matchMedia("(max-width: 900px)").matches;

    // ── 사이드바 메뉴 ──
    function navLink(m) {
      const el = document.createElement(m.ready ? "a" : "div");
      el.className = "nav-item";
      el.dataset.id = m.id;
      if (m.ready) el.href = `#${m.id}`;
      else el.setAttribute("aria-disabled", "true");
      el.title = m.label;
      el.innerHTML = `<span class="initial" aria-hidden="true"></span><span class="label"></span>`;
      el.querySelector(".initial").textContent = m.label.trim().charAt(0);
      el.querySelector(".label").textContent = m.label;
      if (!m.ready) {
        const s = document.createElement("small");
        s.className = "soon";
        s.textContent = "준비 중";
        el.append(s);
      }
      return el;
    }

    function buildNav(profile) {
      const nav = $("nav");
      nav.replaceChildren();
      let groupEl = null;      // 아직 붙이지 않은 그룹 제목
      const put = (...els) => {
        if (groupEl) { nav.append(groupEl); groupEl = null; }
        nav.append(...els);
      };
      for (const m of menu) {
        if (m.group) {
          groupEl = document.createElement("div");
          groupEl.className = "nav-group";
          groupEl.textContent = m.group;
        } else if (m.children) {
          const kids = m.children.filter((c) => canSee(profile, c));
          if (!kids.length) continue;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "nav-item";
          btn.setAttribute("aria-expanded", "false");
          btn.innerHTML = `<span class="initial" aria-hidden="true"></span><span class="label"></span><i class="chev" data-lucide="chevron-left"></i>`;
          btn.querySelector(".initial").textContent = m.label.trim().charAt(0);
          btn.querySelector(".label").textContent = m.label;
          const sub = document.createElement("div");
          sub.className = "nav-sub";
          sub.hidden = true;
          kids.forEach((c) => sub.append(navLink(c)));
          btn.addEventListener("click", () => {
            const open = btn.getAttribute("aria-expanded") !== "true";
            btn.setAttribute("aria-expanded", String(open));
            sub.hidden = !open;
          });
          put(btn, sub);
        } else if (!m.hidden && canSee(profile, m)) {
          put(navLink(m));
        }
      }
      icons();
    }

    // 짧은 안내 (권한 없음 등)
    let toastTimer = null;
    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
    }

    // ── 현재 메뉴 표시 + 브레드크럼 + 제목 ──
    function onRoute(id) {
      const item = flatMenu.find((m) => m.id === id);
      document.querySelectorAll(".nav-item[data-id]").forEach((a) => {
        if (a.dataset.id === id) {
          a.setAttribute("aria-current", "page");
          const sub = a.closest(".nav-sub");
          if (sub) { sub.hidden = false; sub.previousElementSibling.setAttribute("aria-expanded", "true"); }
        } else a.removeAttribute("aria-current");
      });

      const crumbs = $("crumbs");
      crumbs.replaceChildren();
      const home = document.createElement("a");
      home.href = "#home";
      home.textContent = "Home";
      crumbs.append(home);
      if (id !== "home") {
        for (const part of [item.group, item.parent, item.label].filter(Boolean)) {
          crumbs.insertAdjacentHTML("beforeend", `<i data-lucide="chevron-right"></i>`);
          const s = document.createElement("span");
          s.textContent = part;
          crumbs.append(s);
        }
      }
      $("pageTitle").textContent = item.label;
      $("btnBack").hidden = id === "home";
      document.title = `${item.label} · QSA`;
      document.body.classList.remove("side-open");
      icons();
    }

    // ── 시계 (DSA 처럼 초 단위) ──
    let clockTimer = null;
    function startClock() {
      const pad = (n) => String(n).padStart(2, "0");
      const tick = () => {
        const d = new Date();
        $("clock").textContent = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      };
      tick();
      clearInterval(clockTimer);
      clockTimer = setInterval(tick, 1000);
    }

    // ── 화면 전환 ──
    function showLogin(message, isError = false) {
      stopRouter();
      clearInterval(clockTimer);
      $("boot").hidden = true;
      $("shell").hidden = true;
      $("login").hidden = false;
      $("userDrop").hidden = true;
      const box = $("loginMsg");
      box.hidden = !message;
      box.textContent = message || "";
      box.classList.toggle("notice-error", isError);
      $("btnLogin").disabled = false;
      icons();
    }

    let onHash = null;
    function showShell(user, profile) {
      $("boot").hidden = true;
      $("login").hidden = true;
      $("shell").hidden = false;
      const name = user.displayName || user.email.split("@")[0];
      $("userName").textContent = name;
      const roleLabel = profile.role === "admin" ? "관리자" : "일반";
      $("userEmail").textContent = [user.email, [profile.dept, roleLabel].filter(Boolean).join(" · ")].join("\n");
      $("avatar").textContent = name.trim().charAt(0);
      $("year").textContent = new Date().getFullYear();
      startClock();
      buildNav(profile);
      const ctx = { auth, db, user, profile };
      if (onHash) window.removeEventListener("hashchange", onHash);
      onHash = () => render($("view"), ctx, onRoute, () => {
        history.replaceState(null, "", "#home");
        toast("이 메뉴에 대한 권한이 없습니다. 필요하면 교무 관리자에게 요청하세요.");
      });
      window.addEventListener("hashchange", onHash);
      onHash();
    }

    // ── 이벤트 ──
    $("btnLogin").addEventListener("click", async () => {
      $("btnLogin").disabled = true;
      try {
        await signInWithGoogle();
      } catch (e) {
        const closed = e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request";
        showLogin(closed ? "" : `로그인하지 못했습니다. (${e.code || e.message})`, !closed);
      }
    });
    $("btnLogout").addEventListener("click", () => logout());
    $("btnLogoutSide").addEventListener("click", () => logout());

    $("btnMenu").addEventListener("click", () => {
      document.body.classList.toggle(isMobile() ? "side-open" : "side-mini");
    });
    $("scrim").addEventListener("click", () => document.body.classList.remove("side-open"));

    $("btnBack").addEventListener("click", () => {
      if (history.length > 1) history.back();
      else location.hash = "#home";
    });

    $("btnUser").addEventListener("click", (e) => {
      e.stopPropagation();
      const drop = $("userDrop");
      drop.hidden = !drop.hidden;
      $("btnUser").setAttribute("aria-expanded", String(!drop.hidden));
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".user-menu")) {
        $("userDrop").hidden = true;
        $("btnUser").setAttribute("aria-expanded", "false");
      }
    });

    watchAuth(({ state, user, profile, email, error }) => {
      if (state === "allowed") return showShell(user, profile);
      if (onHash) { window.removeEventListener("hashchange", onHash); onHash = null; }
      if (state === "denied") return showLogin(`${email} 계정은 QSA 허용목록에 없습니다. 교무 담당자에게 등록을 요청하세요.`, true);
      if (state === "error") return showLogin(`권한을 확인하지 못했습니다. 보안 규칙 배포 여부를 확인하세요. (${error.code || error.message})`, true);
      showLogin();
    });
  </script>
</body>
</html>
